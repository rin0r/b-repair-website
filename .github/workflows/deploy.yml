name: Deploy nach Hostinger

# Jeder Push auf main baut die Seite und lädt sie nach public_html.
# Manuell auslösbar über den Reiter "Actions" auf GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Zuerst, noch vor der Installation: so steht ein Preisfehler nach
      # wenigen Sekunden ganz oben im Protokoll statt hinter dem Build.
      - name: Preise prüfen
        run: node scripts/preise-pruefen.mjs

      - run: npm ci

      # Ohne die Variable zeigen Sitemap und Canonical auf die Vercel-Domain.
      - run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: https://b-repair.ch

      # Abbruch, falls der Export leer blieb – sonst würde der Upload
      # public_html leerräumen.
      - name: Export prüfen
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/sitemap.xml
          echo "Dateien im Export: $(find out -type f | wc -l)"

      - name: Upload per FTP
        id: upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          # Der FTP-Zugang landet auf Plan-Ebene, nicht im Ordner der Domain.
          # /public_html/ wäre dort ein anderes, ungenutztes Verzeichnis.
          server-dir: /domains/b-repair.ch/public_html/
          # Nur geänderte Dateien gehen hoch; der Stand wird serverseitig vermerkt.
          state-name: .ftp-deploy-state.json
          timeout: 120000

      # Hostinger drosselt FTP, wenn kurz hintereinander Verbindungen kommen.
      # Ein zweiter Anlauf nach kurzer Pause genügt dann.
      - name: Kurz warten
        if: steps.upload.outcome == 'failure'
        run: |
          echo "Erster Upload fehlgeschlagen – zweiter Versuch in 60 Sekunden."
          sleep 60

      - name: Upload erneut versuchen
        if: steps.upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /domains/b-repair.ch/public_html/
          state-name: .ftp-deploy-state.json
          timeout: 120000
